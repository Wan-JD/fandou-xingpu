name = "fandou-xingpu-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"

[vars]
API_ENV = "production"
ALLOWED_ORIGIN = "https://xingpu.example.com"
# Never put administrator passwords or password-derived values in this file.
# Bootstrap the single production administrator through ADMIN_PASSWORD at runtime.

# Replace these placeholders after creating resources in your own Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "fandou-xingpu-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "REPLACE_WITH_R2_BUCKET_NAME"

# The Worker owns only API paths. Cloudflare Pages serves the same hostname otherwise.
[[routes]]
pattern = "xingpu.example.com/api/*"
zone_name = "example.com"
