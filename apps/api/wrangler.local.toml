name = "fandou-xingpu-api-local"
main = "src/index.ts"
compatibility_date = "2024-10-22"

[vars]
API_ENV = "local-d1"

[[d1_databases]]
binding = "DB"
database_name = "fandou-xingpu-local"
# Local-only Wrangler sentinel; this file must not be used for remote deploys.
database_id = "local"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fandou-xingpu-local"
